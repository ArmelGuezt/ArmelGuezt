name: Refresh public profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh from GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh.py
      - name: Commit generated public statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json assets/activity.svg assets/calendar.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile statistics'
            git push
          fi
